<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Stückzähler</title><style>*{box-sizing:border-box}body{margin:0;background:#10151e;color:#eef2f8;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:480px;margin:auto;padding:32px 20px}h1{font-size:28px}section{background:#202937;border-radius:20px;padding:24px;margin:16px 0;text-align:center}#count{font-size:76px;font-weight:700;color:#5ee5a1;font-variant-numeric:tabular-nums}small,p{color:#aebdce}button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:17px;background:#5ee5a1;color:#10251b;width:100%;margin:6px 0}button.secondary{background:#303d50;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid section{margin:0;padding:16px}strong{display:block;font-size:26px;margin-top:8px}</style></head><body><main><h1>Stückzähler</h1><p id="status">Demo-Modus · keine ESP32-Verbindung</p><section><small>Aktueller Zählerstand</small><div id="count">0</div>Stück</section><div class="grid"><section><small>Laufzeit</small><strong id="time">00:00</strong></section><section><small>Stück / Minute</small><strong id="rate">0</strong></section></div><section><button id="toggle">Simulation starten</button><button class="secondary" id="plus">+1 Stück</button><button class="secondary" id="reset">Zurücksetzen</button></section><p id="test">JavaScript-Test: noch nicht gestartet</p></main><script>let n=0,start=Date.now(),running=false;const el=id=>document.getElementById(id);function draw(){let s=Math.floor((Date.now()-start)/1000);el('count').textContent=n;el('time').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');el('rate').textContent=s?Math.round(n*60/s):0;el('test').textContent='JavaScript aktiv · '+new Date().toLocaleTimeString('de-DE');}el('toggle').onclick=()=>{running=!running;el('toggle').textContent=running?'Simulation stoppen':'Simulation starten';};el('plus').onclick=()=>{n++;draw()};el('reset').onclick=()=>{n=0;start=Date.now();draw()};setInterval(()=>{if(running)n++;draw()},1000);draw();</script></body></html>
