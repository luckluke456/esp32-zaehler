<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kaffee Tracker</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#f2f2f7"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#242722;font:15px system-ui,sans-serif}main{max-width:1000px;margin:40px auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:0}small,.muted{color:#777d74}button,input{font:inherit}button{cursor:pointer;border:1px solid #dedfd9;border-radius:10px;background:white;color:inherit;padding:11px 16px}button.active,.primary{background:#294b3d;color:white;border-color:#294b3d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}.tile,.panel{background:white;border:1px solid #e4e5df;border-radius:18px;padding:22px}.num{font-size:34px;font-weight:650;display:block;margin-top:8px}.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}svg{width:100%;height:auto;display:block;overflow:visible}h2{font-size:18px;margin:0 0 12px}input{padding:10px;border:1px solid #ddd;border-radius:8px;max-width:100%}.entry{margin-top:16px}.hint{font-size:12px;color:#777;margin-top:15px}#detail{min-height:24px;color:#294b3d;font-weight:600}footer{margin-top:20px;color:#777;font-size:12px}@media(max-width:600px){main{margin:10px auto;padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.tile,.panel{padding:15px}.num{font-size:28px}button{padding:9px 12px}}

@media(max-width:600px){body{font-size:16px;background:#f2f2f7}main{margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}header{gap:12px}header small{font-size:10px;letter-spacing:1px}h1{font-size:32px}button{min-height:44px;touch-action:manipulation;font-weight:600}header button{white-space:nowrap}.stats{gap:10px;margin:20px 0}.tile,.panel{border:0;border-radius:20px;box-shadow:0 2px 10px #00000008;padding:16px}.num{font-size:34px}.panel>.bar{gap:12px}.panel>.bar:first-child{display:block}#tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;background:#efeff4;border-radius:12px;padding:3px;margin-bottom:16px}#tabs button{padding:8px 2px;font-size:13px;border:0;background:transparent}#tabs button.active{background:white;color:#294b3d;box-shadow:0 1px 4px #0002}#period{font-size:14px;font-weight:600}.panel>.bar:nth-child(2){flex-wrap:nowrap}.panel>.bar:nth-child(2) button{padding:8px 12px}#chart{margin:12px 0;overflow:visible}#detail{font-size:14px}.entry .bar{display:grid;grid-template-columns:minmax(0,1fr) 52px 52px}.entry input{width:100%;min-width:0;font-size:16px;min-height:44px;-webkit-appearance:none;background:#f2f2f7;color:#242722}.entry #selected{grid-column:1/-1}footer{line-height:1.5}footer button{display:block;width:100%;margin-top:12px}small{line-height:1.4}}
</style><main><header><div><small>DEIN PERSÖNLICHER TRACKER</small><h1>☕ Kaffee</h1></div><button class="primary" onclick="change(1)">+1 Kaffee</button></header><div class="stats" id="stats"></div><section class="panel"><div class="bar between"><h2>Kaffeeverlauf</h2><div class="bar" id="tabs"></div></div><div class="bar between"><div id="period" class="muted"></div><div class="bar"><button onclick="move(-1)">‹</button><button onclick="offset=0;render()">Heute</button><button onclick="move(1)">›</button></div></div><svg id="chart" viewBox="0 0 800 330" role="img" aria-label="Kaffeeverlauf"></svg><div id="detail" aria-live="polite"></div><small id="note"></small></section><section class="panel entry"><h2>Kaffee erfassen</h2><div class="bar"><input type="date" id="date"><button onclick="change(-1,true)">−1</button><button class="primary" onclick="change(1,true)">+1</button><span id="selected" class="muted"></span></div><div class="hint">Wähle ein Datum, um auch vergangene Tage zu bearbeiten.</div></section><footer>Deine Daten bleiben in diesem Browser. Die historischen Wochenwerte aus deiner Tabelle sind bereits enthalten. <button onclick="backup()">CSV exportieren</button></footer></main><script>
const key='coffee-tracker-v1';const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const parse=s=>new Date(s+'T12:00:00');const today=()=>parse(fmt(new Date()));const add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};const monday=d=>add(d,-((d.getDay()+6)%7));const month=(d,n=0)=>new Date(d.getFullYear(),d.getMonth()+n,1,12);const year=(d,n=0)=>new Date(d.getFullYear()+n,0,1,12);const de=(d,o)=>d.toLocaleDateString('de-DE',o);let data;try{data=JSON.parse(localStorage.getItem(key))}catch{}if(!data||!data.days)data={days:{},weekly:{'2026-11-02':16,'2026-11-09':7,'2026-11-16':0}};if(data.weekly['2026-11-23']===1)delete data.weekly['2026-11-23'];let mode='Monat',offset=0;const date=document.getElementById('date');date.value=fmt(today());date.max=fmt(today());date.onchange=render;function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch{alert('Speichern im Browser nicht möglich. Bitte CSV exportieren.')}}save();function change(n,chosen=false){let k=chosen?date.value:fmt(today());if(!k||k>fmt(today()))return;data.days[k]=Math.max(0,(data.days[k]||0)+n);save();render()}function sum(a,b,weekly=true){let s=0;for(let [k,v] of Object.entries(data.days))if(k>=fmt(a)&&k<fmt(b))s+=v;if(weekly)for(let [k,v] of Object.entries(data.weekly))if(k>=fmt(a)&&k<fmt(b))s+=v;return s}function total(){return Object.values(data.days).reduce((a,b)=>a+b,0)+Object.values(data.weekly).reduce((a,b)=>a+b,0)}function move(n){if(mode==='Gesamt')return;offset=Math.min(0,offset+n);render()}function kw(d){let t=add(monday(d),3),j=new Date(t.getFullYear(),0,4,12);return 1+Math.round((monday(t)-monday(j))/604800000)}function render(){let t=today(),w=monday(t),m=month(t),y=year(t);document.getElementById('stats').innerHTML=[['Heute',data.days[fmt(t)]||0],['Diese Woche',sum(w,add(w,7))],['Diesen Monat',sum(m,month(m,1))],['Dieses Jahr',sum(y,year(y,1))]].map(([a,b])=>`<div class="tile"><small>${a}</small><span class="num">${b}</span></div>`).join('');document.getElementById('tabs').innerHTML=['Woche','Monat','Jahr','Gesamt'].map(x=>`<button class="${x===mode?'active':''}" onclick="mode='${x}';offset=0;render()">${x}</button>`).join('');let points=[],label='',note='';function p(a,b,l,weekly=true){points.push({label:l,value:a>t?null:sum(a,b,weekly)})}if(mode==='Woche'){let a=add(w,offset*7);label=`KW ${kw(a)} · ${de(a)} – ${de(add(a,6))}`;for(let i=0;i<7;i++){let d=add(a,i);p(d,add(d,1),de(d,{weekday:'short'}),false)}if(data.weekly[fmt(a)]!==undefined)note=`Historischer Wochenwert: ${data.weekly[fmt(a)]} Kaffee (keine Tagesaufteilung vorhanden).`}else if(mode==='Monat'){let a=month(t,offset),b=month(a,1);label=de(a,{month:'long',year:'numeric'});for(let d=monday(a);d<b;d=add(d,7)){let start=d<a?a:d,end=add(d,7)>b?b:add(d,7);p(start,end,'KW '+kw(d))}note='Wochenwerte innerhalb des Monats.'}else if(mode==='Jahr'){let a=year(t,offset);label=''+a.getFullYear();for(let i=0;i<12;i++){let d=month(a,i);p(d,month(d,1),de(d,{month:'short'}))}note='Kaffee pro Monat.'}else{label='Gesamt · '+total()+' Kaffee';let keys=[...Object.keys(data.days),...Object.keys(data.weekly)].sort();let a=year(parse(keys[0]||fmt(t)));for(let d=a;d<=t;d=year(d,1))p(d,year(d,1),''+d.getFullYear());note='Kaffee pro Jahr.'}document.getElementById('period').textContent=label;document.getElementById('note').textContent=note+' Historische Wochenwerte werden dem Monat ihres Wochenbeginns zugeordnet.';document.getElementById('selected').textContent=(data.days[date.value]||0)+' Kaffee an diesem Tag';draw(points)}function draw(p){const mobile=window.innerWidth<=600;const W=mobile?360:800,H=mobile?260:330,L=mobile?30:55,R=mobile?344:770,B=mobile?220:275,T=mobile?20:40;document.getElementById("chart").setAttribute("viewBox",`0 0 ${W} ${H}`);let max=Math.max(4,...p.map(x=>x.value||0)),step=Math.max(1,Math.ceil(max/4));max=step*4;let X=i=>L+(p.length===1?(R-L)/2:i*(R-L)/(p.length-1)),Y=v=>B-v/max*(B-T);let s='';for(let i=0;i<=4;i++){let v=i*step;s+=`<line x1="${L}" x2="${R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e7e9e4"/><text x="${L-7}" y="${Y(v)+4}" text-anchor="end" fill="#858a82" font-size="${mobile?10:12}">${v}</text>`}let valid=p.map((a,i)=>({...a,i})).filter(a=>a.value!==null);if(valid.length>1){let path=valid.map((a,i)=>`${i?'L':'M'}${X(a.i)},${Y(a.value)}`).join(' ');s+=`<path d="${path} L${X(valid.at(-1).i)},${B} L${X(valid[0].i)},${B} Z" fill="#e6efe9"/><path d="${path}" fill="none" stroke="#38765a" stroke-width="3" stroke-linejoin="round"/>`}p.forEach((a,i)=>{if(p.length<=(mobile?7:14)||i%Math.ceil(p.length/(mobile?6:12))===0)s+=`<text x="${X(i)}" y="${B+20}" text-anchor="middle" fill="#777" font-size="${mobile?10:12}">${a.label}</text>`;if(a.value!==null)s+=`<circle cx="${X(i)}" cy="${Y(a.value)}" r="5" fill="#38765a"/><circle tabindex="0" aria-label="${a.label}: ${a.value} Kaffee" cx="${X(i)}" cy="${Y(a.value)}" r="16" fill="transparent" style="cursor:pointer" onpointerenter="detail.textContent='${a.label}: ${a.value} Kaffee'" onfocus="detail.textContent='${a.label}: ${a.value} Kaffee'" onclick="detail.textContent='${a.label}: ${a.value} Kaffee'"><title>${a.label}: ${a.value}</title></circle>`});document.getElementById('chart').innerHTML=s;document.getElementById('detail').textContent=''}function backup(){let csv='Datum;Kaffee;Typ\n'+Object.entries(data.days).map(([k,v])=>`${k};${v};Tag`).concat(Object.entries(data.weekly).map(([k,v])=>`${k};${v};Woche`)).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='kaffee.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}window.addEventListener("resize",render);render();</script></html>
